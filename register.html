<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">

    <title>Register</title>
</head>

<body class="bg-green-100 min-h-screen flex items-center justify-center">

    <div class="bg-white w-96 p-6 rounded-xl shadow-lg text-center">

        <i class="fa-solid fa-building-columns text-green-800 text-5xl"></i>
        <h1 class="text-3xl font-bold text-green-700 mt-3">
            My Bank
        </h1>
        <p class="text-gray-500 mt-2">
            Create your account to get started
        </p>



        <div class="flex mt-8">
            <span class="bg-green-100 p-3">
                <i class="fa-solid fa-user text-green-700"></i>
            </span>
            <input type="text" id="username" placeholder="Username" class="border w-full px-3 outline-none" autocomplete="off">
        </div>


        <div class="flex mt-4">
            <span class="bg-green-100 p-3">
                <i class="fa-solid fa-credit-card text-green-700"></i>
            </span>
            <input type="text" id="accnum" placeholder="Account Number" class="border w-full px-3 outline-none">
        </div>


        <div class="flex mt-4">
            <span class="bg-green-100 p-3">
                <i class="fa-solid fa-lock text-green-700"></i>
            </span>
            <input type="password" id="password" placeholder="Password" class="border w-full px-3 outline-none" autocomplete="off">
        </div>

        
        <button class="bg-green-600 text-white w-full py-2 mt-6 rounded hover:bg-green-900" onclick="register()">
            Register
        </button>

        <p class="mt-5 text-gray-600">
            Already have an account?
            <a href="#" class="text-green-600 font-bold" >Sign in</a>
        </p>

    </div>

</body>
</html>
