<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">

    <title>Register</title>
</head>

<body class="bg-green-50 min-h-screen flex items-center justify-center overflow-x-hidden">

<header class="fixed w-full z-20 top-0 start-0">
    <nav class="bg-green-50">
        <div class="w-full max-w-screen-xl mx-auto px-4 sm:px-6 py-4">

            <!-- Top Row -->
            <div class="flex justify-between items-center">

                <!-- Logo -->
                <a href="https://flowbite.com" class="flex items-center">
                    <span class="font-bold text-xl sm:text-2xl md:text-3xl whitespace-nowrap">
                        <i class="fa-solid fa-building-columns"></i>
                        Finora Bank
                    </span>
                </a>

                <!-- Hamburger -->
                <button
                    id="menuBtn"
                    type="button"
                    class="md:hidden text-2xl text-green-800 focus:outline-none"
                    onclick="toggleMenu()"
                >
                    <i class="fa-solid fa-bars"></i>
                </button>

                <!-- Desktop Menu -->
                <div class="hidden md:flex items-center gap-6">

                    <a href="./index.html"
                       class="text-heading hover:text-green-700">
                        Home
                    </a>

                    <a href="./index.html#service"
                       class="text-heading hover:text-green-700">
                        Services
                    </a>

                    <a href="./index.html#about"
                       class="text-heading hover:text-green-700">
                        About
                    </a>

                    <a href="./index.html#plans"
                       class="text-heading hover:text-green-700">
                        Plans
                    </a>

                    <button
                        class="bg-red-600 text-white px-6 py-2 rounded-lg"
                        onclick="logout()"
                    >
                        Logout
                    </button>

                </div>

            </div>

            <!-- Mobile Menu -->
            <div
                id="mobileMenu"
                class="hidden md:hidden mt-4"
            >
                <div class="flex flex-col items-center gap-4 py-4">

                    <a href="./index.html"
                       class="text-heading hover:text-green-700">
                        Home
                    </a>

                    <a href="./index.html#service"
                       class="text-heading hover:text-green-700">
                        Services
                    </a>

                    <a href="./index.html#about"
                       class="text-heading hover:text-green-700">
                        About
                    </a>

                    <a href="./index.html#plans"
                       class="text-heading hover:text-green-700">
                        Plans
                    </a>

                    <button
                        class="bg-red-600 text-white px-6 py-2 rounded-lg"
                        onclick="logout()"
                    >
                        Logout
                    </button>

                </div>
            </div>

        </div>
    </nav>
</header>

<script>
    function toggleMenu() {
        document.getElementById('mobileMenu').classList.toggle('hidden')
    }
</script>


<section class="w-full min-h-screen px-4 sm:px-6 md:px-8 pt-28 pb-10"
         style="background-image: url('./bank_bg.png');">


<div class="w-full">

    <div id="headd"
         class="text-2xl sm:text-3xl md:text-4xl font-bold text-green-700 text-center pt-5">
        Welcome
    </div>

    <div id="headd"
         class="text-lg sm:text-xl font-bold text-green-700 text-center pt-5">
        Online Banking Services
    </div>


    <div class="w-full max-w-5xl mx-auto flex flex-col lg:flex-row justify-center items-center gap-6 sm:gap-8 lg:gap-10 mt-16 sm:mt-20 md:mt-24">


        <div class="bg-white w-full max-w-sm sm:w-96 min-h-96 p-6 sm:p-7 rounded-xl shadow">

            <h2 class="text-2xl sm:text-3xl font-bold text-green-700 mb-6">
                Deposit
            </h2>

            <input id="amount"
                   type="number"
                   placeholder="Enter Your Amount"
                   class="w-full bg-green-50 p-3 sm:p-4 mb-5 border-b outline-none">

            <input id="pswrd"
                   type="password"
                   placeholder="Enter Your Password"
                   class="w-full bg-green-50 p-3 sm:p-4 mb-6 border-b outline-none">

            <button class="bg-green-600 text-white px-8 py-3 rounded-lg block mx-auto"
                    onclick="balance()">
                Deposit
            </button>

            <div id="result" class="mt-5"></div>

        </div>


        <div class="bg-white w-full max-w-sm sm:w-96 min-h-96 p-6 sm:p-7 rounded-xl shadow">

            <h2 class="text-2xl sm:text-3xl font-bold text-green-700 mb-6">
                Withdraw
            </h2>

            <input id="AMO"
                   type="number"
                   placeholder="Enter Your Amount"
                   class="w-full bg-green-50 p-3 sm:p-4 mb-5 border-b outline-none">

            <input id="PAS"
                   type="password"
                   placeholder="Enter Your Password"
                   class="w-full bg-green-50 p-3 sm:p-4 mb-6 border-b outline-none">

            <button class="bg-green-600 text-white px-8 py-3 rounded-lg block mx-auto"
                    onclick="withdraw()">
                Withdraw
            </button>

            <div id="balan" class="mt-5"></div>

        </div>

    </div>


    <div class="w-full max-w-[780px] bg-white min-h-60 p-5 sm:p-7 rounded-xl shadow mx-auto mt-8 sm:mt-10 overflow-x-auto">

        <h2 class="text-2xl sm:text-3xl font-bold text-green-700 mb-6">
            Transaction History
        </h2>

        <table class="w-full min-w-[600px] text-center">

            <thead class="bg-green-600 text-white">

                <tr>
                    <th class="p-2 sm:p-3">Date</th>
                    <th class="p-2 sm:p-3">Type</th>
                    <th class="p-2 sm:p-3">Amount</th>
                    <th class="p-2 sm:p-3">Balance</th>
                </tr>

            </thead>

            <tbody id="balhistory"></tbody>

        </table>

    </div>

</div>


<script>
    let use=localStorage.getItem('username')
    document.getElementById('headd').innerHTML=`Welcome ${use}`
</script>


</section>

</body>
</html>
