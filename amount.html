<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">

    <title>Register</title>
</head>

<body class="bg-green-50 min-h-screen flex items-center justify-center">




<header class="fixed w-full z-20 top-0 start-0">
  <nav class="bg-green-100">
      <div class="flex flex-wrap justify-between items-center mx-auto max-w-screen-xl p-4">
          <a href="https://flowbite.com" class="flex items-center space-x-3 rtl:space-x-reverse">
              <span class="self-center  text-heading  whitespace-nowrap font-bold text-3xl"> <i class="fa-solid fa-building-columns"></i> Finora Bank</span>
          </a>
          <div class="flex items-center space-x-6 rtl:space-x-reverse">
              <ul class="flex flex-col p-4 md:p-0 mt-4 font-medium border border-default rounded-base bg-neutral-secondary-soft md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 md:bg-neutral-primary">
        <li>
          <a href="#" class="block py-2 px-3 text-heading rounded hover:bg-neutral-tertiary md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent" aria-current="page">Home</a>
        </li>
        <li>
          <a href="#" class="block py-2 px-3 text-heading rounded hover:bg-neutral-tertiary md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent">Features</a>
        </li>
        <li>
          <a href="#" class="block py-2 px-3 text-heading rounded hover:bg-neutral-tertiary md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent">pricing</a>
        </li>
        <li>
          <a href="#" class="block py-2 px-3 text-heading rounded hover:bg-neutral-tertiary md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent">About</a>
        </li>
      </ul>
          </div>
      </div>
  </nav>

</header>





<div class="mt-20">

    <div class="flex justify-center gap-10">

        <div class="bg-white w-96 h-96 p-7 rounded-xl shadow">
            <h2 class="text-3xl font-bold text-green-700 mb-6">
                Deposit
            </h2>
            <input id="amount" type="number" placeholder="Enter Your Amount"  class="w-full bg-green-50 p-4 mb-5 border-b outline-none">
            <input id="pswrd" type="password" placeholder="Enter Your Password" class="w-full bg-green-50 p-4 mb-6 border-b outline-none">
            <button class="bg-green-600 text-white px-8 py-3 rounded-lg block mx-auto" onclick="balance()"> 
                Deposit
            </button>
            <div id="result" class="mt-5"></div>
        </div>


       
        <div class="bg-white w-96 h-96 p-7 rounded-xl shadow">
            <h2 class="text-3xl font-bold text-green-700 mb-6">
                Withdraw
            </h2>
            <input id="AMO" type="number"  placeholder="Enter Your Amount" class="w-full bg-green-50 p-4 mb-5 border-b outline-none">
            <input id="PAS" type="password" placeholder="Enter Your Password" class="w-full bg-green-50 p-4 mb-6 border-b outline-none">
            <button class="bg-green-600 text-white px-8 py-3 rounded-lg block mx-auto " onclick="withdraw()">
                Withdraw
            </button>
            <div id="balan" class="mt-5"></div>
        </div>
    </div>



    <div class="bg-white w-[780px] h-60 p-7 rounded-xl shadow mx-auto mt-10">
        <h2 class="text-3xl font-bold text-green-700 mb-6">
            Transaction History
        </h2>
        <table class="w-full text-center">
            <thead class="bg-green-600 text-white">
                <tr>
                    <th class="p-3">Date</th>
                    <th class="p-3">Type</th>
                    <th class="p-3">Amount</th>
                    <th class="p-3">Balance</th>
                </tr>
            </thead>

            <tbody id="balhistory"></tbody>
        </table>
    </div>
</div>



















</body>
</html>
